<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annie Rock Records - Studio Backdoor</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            padding: 15px;
            padding-bottom: 80px;
            max-width: 600px;
            margin: 0 auto;
        }
        h1 { color: #bb86fc; font-size: 1.5rem; text-align: center; margin-bottom: 5px; }
        p.sub-title { color: #888; text-align: center; font-size: 0.9rem; margin-bottom: 20px; }
        
        /* Auth Container */
        #auth-container {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 25px;
            text-align: center;
            margin-top: 40px;
        }
        input[type="password"] {
            width: 80%;
            padding: 10px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #fff;
            border-radius: 4px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 1rem;
        }

        /* Studio Panel UI */
        .admin-section {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .section-header {
            font-size: 1.1rem;
            font-weight: bold;
            color: #00e676;
            margin-bottom: 12px;
            border-bottom: 1px solid #333;
            padding-bottom: 6px;
        }

        /* 3-Track Recorder Styling */
        .track-card {
            background: #252525;
            border: 1px solid #3d3d3d;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .track-title { font-weight: bold; margin-bottom: 8px; color: #bb86fc; }
        .controls { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 10px; 
            gap: 8px;
        }
        button {
            background: #bb86fc;
            color: #000;
            border: none;
            padding: 10px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
        }
        button.rec { background: #cf6679; color: #fff; }
        button.recording { background: #ff1744; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        
        audio { width: 100%; margin-top: 8px; }
        .latency-control { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: #aaa; }
        input[type="number"], input[type="text"] {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            padding: 6px;
            border-radius: 4px;
        }
        input[type="number"] { width: 60px; text-align: center; }
        .master-controls {
            text-align: center;
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .master-btn { background: #00e676; font-size: 1rem; padding: 12px; }
    </style>
</head>
<body>

    <!-- GATEKEEPER / AUTH SECTION -->
    <div id="auth-container">
        <h2>🔒 Annie Rock Backdoor</h2>
        <p style="color:#aaa; font-size:0.85rem;">Enter Admin Passcode to Access Studio Controls</p>
        <input type="password" id="passcode" placeholder="Enter Passcode">
        <br>
        <button onclick="checkPasscode()" style="padding:10px 24px;">Unlock Dashboard</button>
    </div>

    <!-- MAIN ADMIN DASHBOARD (HIDDEN UNTIL LOGIN) -->
    <div id="admin-panel" style="display: none;">
        
        <h1>⚡ Annie Rock Records</h1>
        <p class="sub-title">Private Studio Backdoor Console</p>

        <!-- 3-TRACK FIELD RECORDER -->
        <div class="admin-section">
            <div class="section-header">🎙️ Mobile 3-Track Field Recorder</div>

            <!-- TRACK 1 -->
            <div class="track-card">
                <div class="track-title">Track 1</div>
                <div class="controls">
                    <button id="btn-1" class="rec" onclick="toggleRecord(1)">Record</button>
                    <div class="latency-control">
                        <label>Offset (ms):</label>
                        <input type="number" id="offset-1" value="0" onchange="updateOffset(1, this.value)">
                    </div>
                </div>
                <audio id="audio-1" controls></audio>
            </div>

            <!-- TRACK 2 -->
            <div class="track-card">
                <div class="track-title">Track 2</div>
                <div class="controls">
                    <button id="btn-2" class="rec" onclick="toggleRecord(2)">Record</button>
                    <div class="latency-control">
                        <label>Offset (ms):</label>
                        <input type="number" id="offset-2" value="0" onchange="updateOffset(2, this.value)">
                    </div>
                </div>
                <audio id="audio-2" controls></audio>
            </div>

            <!-- TRACK 3 -->
            <div class="track-card">
                <div class="track-title">Track 3</div>
                <div class="controls">
                    <button id="btn-3" class="rec" onclick="toggleRecord(3)">Record</button>
                    <div class="latency-control">
                        <label>Offset (ms):</label>
                        <input type="number" id="offset-3" value="0" onchange="updateOffset(3, this.value)">
                    </div>
                </div>
                <audio id="audio-3" controls></audio>
            </div>

            <!-- MASTER CONTROLS -->
            <div class="master-controls">
                <button class="master-btn" onclick="playAll()">▶ Play All Tracks Together</button>
                <button onclick="stopAll()" style="background:#444; color:#fff;">⏹ Stop Playback</button>
            </div>
        </div>

        <!-- SITE CONTENT MANAGEMENT SECTION -->
        <div class="admin-section">
            <div class="section-header">⚙️ Catalog & Content Dispatch</div>
            <p style="font-size:0.85rem; color:#aaa;">Manage front-door announcements and catalog entries.</p>
            <input type="text" id="announcement-input" placeholder="New Front-Door Announcement..." style="width:100%; margin-bottom:10px;">
            <button onclick="alert('Announcement dispatched!')" style="width:100%;">Post Update to Front Door</button>
        </div>

    </div>

<script>
// PASSCODE AUTHORIZATION
function checkPasscode() {
    const input = document.getElementById("passcode").value;
    // Default admin passcode
    if (input === "annierock2026") {
        document.getElementById("auth-container").style.display = "none";
        document.getElementById("admin-panel").style.display = "block";
    } else {
        alert("Incorrect passcode.");
    }
}

// MULTI-TRACK AUDIO ENGINE & FIXES
let mediaRecorder;
let activeStream = null;
let audioChunks = [];
let recordedBlobs = { 1: null, 2: null, 3: null };
let isRecording = false;
let activeTrack = null;
let trackOffsets = { 1: 0, 2: 0, 3: 0 };

function updateOffset(trackNum, val) {
  trackOffsets[trackNum] = parseInt(val, 10) || 0;
}

function getSupportedMimeType() {
  const types = ['audio/webm', 'audio/mp4', 'audio/aac', 'audio/ogg'];
  for (let t of types) {
    if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) {
      return t;
    }
  }
  return '';
}

async function toggleRecord(trackNum) {
  if (isRecording) {
    if (activeTrack === trackNum) {
      stopRecording();
    }
    return;
  }

  try {
    activeStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    
    const mimeType = getSupportedMimeType();
    const options = mimeType ? { mimeType } : {};
    
    mediaRecorder = new MediaRecorder(activeStream, options);
    audioChunks = [];
    activeTrack = trackNum;

    playOtherTracks(trackNum);

    mediaRecorder.ondataavailable = event => {
      if (event.data.size > 0) audioChunks.push(event.data);
    };

    mediaRecorder.onstop = () => {
      const finalMime = mediaRecorder.mimeType || 'audio/mp4';
      const blob = new Blob(audioChunks, { type: finalMime });
      recordedBlobs[trackNum] = blob;
      
      const audioUrl = URL.createObjectURL(blob);
      const audioElement = document.getElementById(`audio-${trackNum}`);
      audioElement.src = audioUrl;
      
      const btn = document.getElementById(`btn-${trackNum}`);
      btn.innerText = "Record";
      btn.classList.remove("recording");

      stopBackingTracks();

      if (activeStream) {
        activeStream.getTracks().forEach(track => track.stop());
        activeStream = null;
      }
    };

    mediaRecorder.start();
    isRecording = true;

    const btn = document.getElementById(`btn-${trackNum}`);
    btn.innerText = "⏹ Stop";
    btn.classList.add("recording");

  } catch (err) {
    alert("Microphone permission denied or unsupported audio format on this browser.");
  }
}

function stopRecording() {
  if (mediaRecorder && isRecording) {
    mediaRecorder.stop();
    isRecording = false;
  }
}

function stopBackingTracks() {
  [1, 2, 3].forEach(t => {
    const el = document.getElementById(`audio-${t}`);
    if (el) {
      el.pause();
      el.currentTime = 0;
    }
  });
}

function stopAll() {
  stopRecording();
  stopBackingTracks();
}

function playTrackWithOffset(trackNum) {
  const el = document.getElementById(`audio-${trackNum}`);
  if (!el || !recordedBlobs[trackNum]) return;

  const offsetMs = trackOffsets[trackNum];
  
  if (offsetMs >= 0) {
    setTimeout(() => {
      el.currentTime = 0;
      el.play().catch(() => {});
    }, offsetMs);
  } else {
    el.currentTime = Math.abs(offsetMs) / 1000;
    el.play().catch(() => {});
  }
}

function playOtherTracks(currentTrack) {
  [1, 2, 3].forEach(t => {
    if (t !== currentTrack && recordedBlobs[t]) {
      playTrackWithOffset(t);
    }
  });
}

function playAll() {
  [1, 2, 3].forEach(t => {
    if (recordedBlobs[t]) {
      playTrackWithOffset(t);
    }
  });
}
</script>
</body>
</html>
