<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annie Rock Records - Studio Backdoor</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        h1 { color: #bb86fc; font-size: 1.5rem; text-align: center; }
        .track-card {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .track-title { font-weight: bold; margin-bottom: 8px; color: #00e676; }
        .controls { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
        button {
            background: #bb86fc;
            color: #000;
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        button.rec { background: #cf6679; color: #fff; }
        audio { width: 100%; margin-top: 10px; }
        .latency-control { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #aaa; }
        input[type="number"] {
            width: 70px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            padding: 4px;
            border-radius: 4px;
        }
        .master-controls {
            text-align: center;
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #333;
        }
        .master-btn { background: #00e676; font-size: 1.1rem; padding: 12px 24px; }
    </style>
</head>
<body>

    <h1>🎙️ Annie Rock - 3-Track Recorder</h1>

    <!-- TRACK 1 -->
    <div class="track-card">
        <div class="track-title">Track 1</div>
        <div class="controls">
            <button class="rec" onclick="toggleRecord(1)">Record / Stop</button>
            <div class="latency-control">
                <label>Offset (ms):</label>
                <input type="number" value="0" onchange="updateOffset(1, this.value)">
            </div>
        </div>
        <audio id="audio-1" controls></audio>
    </div>

    <!-- TRACK 2 -->
    <div class="track-card">
        <div class="track-title">Track 2</div>
        <div class="controls">
            <button class="rec" onclick="toggleRecord(2)">Record / Stop</button>
            <div class="latency-control">
                <label>Offset (ms):</label>
                <input type="number" value="0" onchange="updateOffset(2, this.value)">
            </div>
        </div>
        <audio id="audio-2" controls></audio>
    </div>

    <!-- TRACK 3 -->
    <div class="track-card">
        <div class="track-title">Track 3</div>
        <div class="controls">
            <button class="rec" onclick="toggleRecord(3)">Record / Stop</button>
            <div class="latency-control">
                <label>Offset (ms):</label>
                <input type="number" value="0" onchange="updateOffset(3, this.value)">
            </div>
        </div>
        <audio id="audio-3" controls></audio>
    </div>

    <!-- MASTER CONTROLS -->
    <div class="master-controls">
        <button class="master-btn" onclick="playAll()">▶ Play All Tracks Together</button>
        <button onclick="stopRecording()" style="background:#555; color:#fff;">⏹ Stop All</button>
    </div>

<script>
let mediaRecorder;
let audioChunks = [];
let recordedBlobs = { 1: null, 2: null, 3: null };
let isRecording = false;
let activeTrack = null;

// Track offset delays in milliseconds (default: 0ms)
let trackOffsets = { 1: 0, 2: 0, 3: 0 };

function updateOffset(trackNum, val) {
  trackOffsets[trackNum] = parseInt(val, 10) || 0;
}

async function toggleRecord(trackNum) {
  if (isRecording) {
    stopRecording();
    return;
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    
    // Note: Standard browser MediaRecorder outputs webm audio
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    activeTrack = trackNum;

    // Play other tracks with their respective latency offsets
    playOtherTracks(trackNum);

    mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
    mediaRecorder.onstop = () => {
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      recordedBlobs[trackNum] = blob;
      const audioUrl = URL.createObjectURL(blob);
      const audioElement = document.getElementById(`audio-${trackNum}`);
      audioElement.src = audioUrl;
    };

    mediaRecorder.start();
    isRecording = true;
  } catch (err) {
    alert("Microphone access denied or not supported.");
  }
}

function stopRecording() {
  if (mediaRecorder && isRecording) {
    mediaRecorder.stop();
    isRecording = false;
  }
  [1, 2, 3].forEach(t => {
    const el = document.getElementById(`audio-${t}`);
    if (el) el.pause();
  });
}

function playTrackWithOffset(trackNum) {
  const el = document.getElementById(`audio-${trackNum}`);
  if (!el || !recordedBlobs[trackNum]) return;

  const offsetMs = trackOffsets[trackNum];
  
  if (offsetMs >= 0) {
    // Delay playback start by positive offset
    setTimeout(() => {
      el.currentTime = 0;
      el.play();
    }, offsetMs);
  } else {
    // Start audio slightly ahead into the file if offset is negative
    el.currentTime = Math.abs(offsetMs) / 1000;
    el.play();
  }
}

function playOtherTracks(currentTrack) {
  [1, 2, 3].forEach(t => {
    if (t !== currentTrack && recordedBlobs[t]) {
      playTrackWithOffset(t);
    }
  });
}

function playAll() {
  [1, 2, 3].forEach(t => {
    if (recordedBlobs[t]) {
      playTrackWithOffset(t);
    }
  });
}
</script>
</body>
</html>
